name: Maintained Fork CI

# The eleven workflows inherited from upstream trigger on `master` only.
# This fork lives on `maintained/v4.28.2`, so none of them run on a normal
# push here. Keep fork-specific checks in a separate file instead of editing
# upstream workflow files, and never enable the upstream release / image
# publishing workflows on this branch.
#
# The dashboard and full-suite jobs below replace coverage the fork never had:
# the upstream dashboard CI skips itself on forks via a repository condition, and
# the upstream unit-test workflows are disabled in this repo's settings. Both
# were observed green on a manual run before being bound to every push/PR.
# The full upstream suite takes about five minutes; keep its timeout generous.

on:
  push:
    branches:
      - maintained/v4.28.2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintained-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintained-tests:
    name: pytest tests/maintained
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The frozen-API and manifest guards run `git diff` against the
          # baseline tag; a shallow checkout does not fetch that tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      # Reuse the upstream CI script; it takes pytest targets as arguments.
      - name: Run the maintained suite
        run: bash ./scripts/run_pytests_ci.sh ./tests/maintained

  static-checks:
    name: ruff + README language ring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # sync_audit.py compares the two upstream baseline tags; a shallow
          # checkout without tags would silently turn the audit into a SKIP.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Ruff format and lint
        run: |
          uvx --from ruff==0.15.22 ruff format --check .
          uvx --from ruff==0.15.22 ruff check .

      - name: Validate the seven-file README ring
        run: python maintained/tools/check_readme_ring.py .

      - name: Upstream sync audit
        run: PYTHONPATH=maintained python -m tools.sync_audit

  dashboard-build:
    name: dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          # pnpm 12 ignores pnpm.overrides in the lockfile (9.0) and fails.
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # `npm run stamp` invokes `python ../scripts/stamp_dashboard_version.py`.
          python-version: '3.12'

      - name: Check i18n keys
        working-directory: dashboard
        run: pnpm run i18n:check

      - name: Install and build
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

  upstream-suite:
    name: full upstream pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install Linux sandbox dependency
        run: |
          # GitHub-hosted runners prefer azure.archive.ubuntu.com, which
          # intermittently fails DNS resolution (actions/runner-images#675).
          # Use the public mirrors and fail over quickly instead of stalling
          # for ~4 minutes on a dead Azure mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' \
            'Acquire::Retries "0";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99-maintained-apt > /dev/null
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu AppArmor blocks unprivileged user namespaces by default;
          # the real sandbox tests need them on this ephemeral runner.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / /bin/true

      - name: Run the full upstream suite
        run: bash ./scripts/run_pytests_ci.sh ./tests
